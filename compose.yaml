services:
  signalroom:
    build: .
    ports:
      - "4174:4174"
    environment:
      APP_ORIGIN: "${APP_ORIGIN:-http://localhost:4174}"
      DATABASE_PATH: "/data/signalroom.db"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-168}"
      TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:-0}"
    volumes:
      - signalroom-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4174/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  signalroom-data:
